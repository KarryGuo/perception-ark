<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#04060C" />
  <link rel="icon" type="image/x-icon" href="./icon.ico" />
  <link rel="shortcut icon" type="image/x-icon" href="./icon.ico" />
  <link rel="apple-touch-icon" href="./icon.ico" />
  <title>感知方舟</title>
  <style>
    /* JS加载前的初始提示,避免WebView黑屏 */
    #app-loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #04060C; color: #00FFA3;
      font-family: -apple-system, "Noto Sans SC", sans-serif;
      gap: 16px; z-index: 9999;
    }
    #app-loading .icon { font-size: 3rem; animation: spin 1.2s linear infinite; }
    #app-loading .text { font-size: 1.1rem; }
    #app-loading .hint { font-size: .8rem; color: #8893A8; }
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
  </style>
</head>
<body>
  <div id="root">
    <div id="app-loading">
      <div class="icon">⚡</div>
      <div class="text">正在启动感知方舟...</div>
      <div class="hint">首次访问需要等待服务唤醒</div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
