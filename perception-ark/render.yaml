# Render Blueprint - 感知方舟全栈部署配置
# 文档: https://render.com/docs/blueprint-spec
# 使用方法: 在 Render Dashboard > New > Blueprint 选择本仓库根目录
# 架构: 前端Vite构建产物由后端Express静态服务托管,单一URL访问
# 注意: Starter套餐($7/月)支持持久化磁盘+不休眠,数据重启不丢失

services:
  - type: web
    name: perception-ark
    runtime: node
    plan: starter  # 升级到Starter套餐以支持持久化磁盘($7/月),数据不丢失
    region: singapore  # 新加坡节点,访问中国相对较快
    branch: main
    rootDir: perception-ark  # 项目根目录
    buildCommand: bash -c "cd frontend && npm install --include=dev && npm run build && cd ../backend && npm install"
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    # 持久化磁盘: 重启/重新部署后数据保留(账号/聊天记录/SOS记录等)
    disks:
      - name: ark-data
        mountPath: /data
        sizeGB: 1  # 1GB足够SQLite数据库使用
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATA_DIR
        value: /data  # 持久化磁盘目录,重启不丢失
      # ===== Turso 云数据库 (推荐,解决Render重新部署数据丢失问题) =====
      # 配置后数据存储在Turso云端,重新部署/休眠唤醒都不会丢数据
      # 未配置时自动降级到本地文件SQLite(/data/memory.db,依赖持久化磁盘)
      - key: TURSO_URL
        sync: false  # 在Render界面填写,格式: libsql://xxx.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false  # 在Render界面填写,Turso平台生成的访问令牌
      # ===== 阿里千问 Qwen API (必填,否则使用MOCK模式) =====
      # 全模态模型 qwen3.5-omni-flash: 视觉+文本+音频+视频
      - key: QWEN_API_KEY
        sync: false  # 在Render界面手动填写,以sk-开头
      - key: QWEN_MODEL
        value: qwen3.5-omni-flash
      - key: QWEN_API_BASE
        value: https://dashscope.aliyuncs.com/compatible-mode/v1
      # ===== 高德地图 API =====
      # 后端REST API (导航/POI搜索/逆地理编码/天气)
      - key: AMAP_API_KEY
        sync: false
      # 前端JS API Key (Vite构建时注入,Render界面填写)
      - key: VITE_AMAP_JS_KEY
        sync: false
      # 前端JS API 安全密钥 (Vite构建时注入,Render界面填写)
      - key: VITE_AMAP_SECURITY_CODE
        sync: false
      # ===== JWT密钥 (建议填写,保证token安全) =====
      - key: JWT_SECRET
        sync: false
      # ===== Mock模式开关 =====
      - key: MOCK_MODE
        value: 'false'  # 配置API Key后使用真实模式
