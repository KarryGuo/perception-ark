# Render Blueprint - 感知方舟全栈部署配置
# 文档: https://render.com/docs/blueprint-spec
# 使用方法: 在 Render Dashboard > New > Blueprint 选择本仓库根目录
# 架构: 前端Vite构建产物由后端Express静态服务托管,单一URL访问
# 注意: Starter套餐($7/月)支持持久化磁盘+不休眠,数据重启不丢失

services:
  - type: web
    name: perception-ark
    runtime: node
    plan: starter  # 升级到Starter套餐以支持持久化磁盘($7/月),数据不丢失
    region: singapore  # 新加坡节点,访问中国相对较快
    branch: main
    rootDir: perception-ark  # 项目根目录
    buildCommand: bash -c "cd frontend && npm install --include=dev && npm run build && cd ../backend && npm install"
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    # 持久化磁盘: 重启/重新部署后数据保留(账号/聊天记录/SOS记录等)
    disks:
      - name: ark-data
        mountPath: /data
        sizeGB: 1  # 1GB足够SQLite数据库使用
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATA_DIR
        value: /data  # 持久化磁盘目录,重启不丢失
      # ===== 火山引擎方舟 API (必填,否则使用MOCK模式) =====
      - key: ARK_API_KEY
        sync: false  # 在Render界面手动填写,不在配置中暴露
      - key: ARK_VISION_MODEL
        sync: false  # 在Render界面填写推理接入点ID(如ep-2026xxxx)
      - key: ARK_TEXT_MODEL
        sync: false  # 在Render界面填写推理接入点ID(如ep-2026xxxx)
      - key: ARK_API_BASE
        value: https://ark.cn-beijing.volces.com/api/v3
      # ===== 高德地图 API =====
      # 后端REST API (导航/POI搜索/逆地理编码)
      - key: AMAP_API_KEY
        sync: false
      # 前端JS API Key (Vite构建时注入,Render界面填写)
      - key: VITE_AMAP_JS_KEY
        sync: false
      # 前端JS API 安全密钥 (Vite构建时注入,Render界面填写)
      - key: VITE_AMAP_SECURITY_CODE
        sync: false
      # ===== Mock模式开关 =====
      - key: MOCK_MODE
        value: 'false'  # 配置API Key后使用真实模式
